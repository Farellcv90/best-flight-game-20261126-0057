<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Langit Nusantara: Island Courier</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a2a44;
    font-family: "Segoe UI", system-ui, sans-serif; color: #f5f0e6; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud-root { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .hud { position: absolute; inset: 0; font-size: 14px; }
  .hud-top { position: absolute; top: 0; left: 0; right: 0; display: flex;
    justify-content: space-between; padding: 12px 16px; }
  .hud-mission { background: rgba(8, 24, 44, 0.72); border: 1px solid rgba(255, 210, 120, 0.5);
    border-radius: 8px; padding: 8px 14px; font-weight: 600; letter-spacing: 0.02em; }
  .hud-score { background: rgba(8, 24, 44, 0.72); border: 1px solid rgba(255, 210, 120, 0.5);
    border-radius: 8px; padding: 8px 14px; text-align: right; }
  .hud-score-value { font-size: 26px; font-weight: 800; color: #ffd678; display: block; line-height: 1; }
  .hud-score-label { font-size: 10px; letter-spacing: 0.25em; color: #bcd3ee; }
  .hud-left { position: absolute; left: 16px; top: 84px; display: flex; flex-direction: column; gap: 10px; }
  .hud-right { position: absolute; right: 16px; top: 84px; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
  .gauge { background: rgba(8, 24, 44, 0.72); border: 1px solid rgba(160, 200, 255, 0.35);
    border-radius: 8px; padding: 8px 12px; width: 190px; }
  .gauge-label { font-size: 10px; letter-spacing: 0.25em; color: #bcd3ee; }
  .gauge-value { font-size: 24px; font-weight: 800; color: #fff; line-height: 1.15;
    text-shadow: 0 0 12px rgba(120, 200, 255, 0.8); }
  .gauge-bar { height: 8px; background: rgba(255,255,255,0.15); border-radius: 4px; margin-top: 4px; overflow: hidden; }
  .gauge-bar.vertical { height: 64px; width: 12px; margin-left: auto; }
  .gauge-fill { height: 100%; border-radius: 4px; transition: width 0.15s, height 0.15s; }
  .alt-fill { background: linear-gradient(90deg, #37b6ff, #7ee0ff); width: 0; }
  .spd-fill { background: linear-gradient(90deg, #37e6a0, #a5f3c0); width: 0; }
  .thr-fill { background: linear-gradient(180deg, #ff9a3d, #ffd678); width: 100%; height: 0; }
  .fuel-fill { background: linear-gradient(90deg, #ffc21a, #ffe08a); width: 100%; }
  .fuel-fill.low { background: linear-gradient(90deg, #ff4d4d, #ff9a3d); }
  .compass { position: relative; width: 52px; height: 52px; margin: 6px auto 0;
    border: 2px solid rgba(255, 214, 120, 0.7); border-radius: 50%;
    background: radial-gradient(circle, rgba(20, 50, 90, 0.9), rgba(8, 24, 44, 0.9)); }
  .compass-needle { position: absolute; left: 50%; top: 4px; width: 2px; height: 22px;
    background: #ff5a4d; transform-origin: 50% 22px; margin-left: -1px; }
  .horizon-box { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
    background: rgba(8, 24, 44, 0.72); border: 1px solid rgba(160, 200, 255, 0.35);
    border-radius: 8px; padding: 8px 12px 10px; text-align: center; }
  .horizon { position: relative; width: 120px; height: 120px; margin: 6px auto 0;
    border-radius: 50%; overflow: hidden; border: 3px solid #d8c9a3; }
  .horizon-disc { position: absolute; inset: -40%; }
  .horizon-sky { position: absolute; left: 0; right: 0; top: 0; height: 50%;
    background: linear-gradient(180deg, #2e5fa3, #7fb2e5); }
  .horizon-ground { position: absolute; left: 0; right: 0; bottom: 0; height: 50%;
    background: linear-gradient(180deg, #8a6a3f, #4d8a3f); }
  .horizon-line { position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: #fff; }
  .horizon-fixed { position: absolute; left: 50%; top: 50%; width: 44px; height: 2px;
    background: #ffd678; transform: translate(-50%, -50%); }
  .ring-dots { font-size: 18px; letter-spacing: 4px; }
  .ring-dot { color: rgba(255,255,255,0.25); }
  .ring-dot.done { color: #37e6a0; text-shadow: 0 0 10px #37e6a0; }
  .hud-warnings { position: absolute; right: 16px; bottom: 18px; display: flex; flex-direction: column; gap: 6px; }
  .warn { display: none; background: rgba(60, 8, 8, 0.85); border: 1px solid #ff5a4d; color: #ffb3ab;
    font-weight: 800; letter-spacing: 0.15em; padding: 6px 12px; border-radius: 6px; font-size: 12px; }
  .warn.on { display: block; animation: blink 0.7s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.35; } }
  .hud-toast { position: absolute; left: 50%; top: 22%; transform: translateX(-50%);
    background: rgba(8, 24, 44, 0.85); border: 1px solid #ffd678; color: #ffe9b8;
    padding: 10px 20px; border-radius: 10px; font-size: 18px; font-weight: 700;
    opacity: 0; transition: opacity 0.3s; white-space: nowrap; }
  .hud-toast.show { opacity: 1; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    z-index: 10; background: rgba(6, 16, 32, 0.30); }
  .panel { max-width: 560px; margin: 16px; background: rgba(8, 24, 44, 0.92);
    border: 1px solid rgba(255, 210, 120, 0.55); border-radius: 16px; padding: 28px 32px;
    text-align: center; box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5); }
  .panel h1 { margin: 0; font-size: 40px; color: #ffd678; letter-spacing: 0.02em; }
  .panel h2 { margin: 2px 0 12px; font-size: 22px; color: #7ee0ff; font-weight: 600; }
  .panel p { line-height: 1.55; }
  .panel .tagline { font-size: 17px; }
  .panel .controls { font-size: 13px; color: #bcd3ee; }
  .panel .best { color: #ffd678; font-weight: 700; }
  .panel .score-big { font-size: 44px; font-weight: 800; color: #37e6a0; margin: 8px 0; }
  .panel ul { text-align: left; line-height: 1.7; }
  .panel button { margin: 8px 4px 0; padding: 12px 26px; font-size: 17px; font-weight: 700;
    color: #1a2a44; background: linear-gradient(180deg, #ffd678, #ff9a3d); border: none;
    border-radius: 10px; cursor: pointer; }
  .panel button:hover { filter: brightness(1.1); }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Langit Nusantara: Island Courier — fly the courier plane through five rings and land on the runway"></canvas>
<div id="hud-root"></div>
<div id="overlay"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
